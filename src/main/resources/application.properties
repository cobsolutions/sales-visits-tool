spring.application.name=sales
# =========================
# Seed Super Admin
# =========================
app.seed.super-admin.username=superadmin
app.seed.super-admin.email=superadmin@cobsolution.com
app.seed.super-admin.password=${SUPER_ADMIN_PASSWORD:superadmin123}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:K7p9Lm2xQzR8vN4wT6yU1aB3cD5eF7gH9iJ0kL2mN4o=}
jwt.expiration-ms=86400000

# =========================
# PostgreSQL Database
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/sales-visits
spring.datasource.username=postgres
spring.datasource.password=password

spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Flyway (if used)
# =========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
